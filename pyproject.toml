[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-blobby-volley"
version = "0.1.0"
description = "A classic Blobby Volley arcade game recreation in Python with Pygame-CE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce>=2.5.0",
]

[project.scripts]
blobby-volley = "blobby_volley.main:main"

[tool.setuptools.packages.find]
where = ["src"]
